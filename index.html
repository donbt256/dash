<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dashboard</title>


<style>

:root {

    color-scheme: light dark;

    --bg: Canvas;

    --surface:
        color-mix(
            in srgb,
            Canvas 94%,
            CanvasText 6%
        );

    --surface-2:
        color-mix(
            in srgb,
            Canvas 88%,
            CanvasText 12%
        );

    --text:
        CanvasText;

    --muted:
        color-mix(
            in srgb,
            CanvasText 60%,
            Canvas 40%
        );

    --border:
        color-mix(
            in srgb,
            CanvasText 18%,
            Canvas 82%
        );

    --accent:
        #4f7cff;
}


* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    min-height: 100%;
}


body {

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        var(--bg);

    color:
        var(--text);
}


button,
input {

    font: inherit;
}


button {

    cursor: pointer;
}


.hidden {

    display: none !important;
}


/* =========================================================
   LOGIN
   ========================================================= */

#loginScreen {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 24px;
}


.login-card {

    width: 100%;

    max-width: 420px;

    background:
        var(--surface);

    border:
        1px solid var(--border);

    border-radius:
        18px;

    padding:
        32px;

    box-shadow:
        0 18px 50px
        rgba(0, 0, 0, 0.12);
}


.login-card h1 {

    margin:
        0 0 8px;

    font-size:
        1.8rem;
}


.login-card p {

    color:
        var(--muted);

    line-height:
        1.5;
}


#password {

    width:
        100%;

    padding:
        12px 14px;

    border-radius:
        10px;

    border:
        1px solid var(--border);

    background:
        var(--bg);

    color:
        var(--text);

    outline:
        none;
}


#password:focus {

    border-color:
        var(--accent);
}


.login-actions {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    margin-top:
        16px;
}


.primary-button {

    border:
        0;

    background:
        var(--accent);

    color:
        white;

    padding:
        11px 18px;

    border-radius:
        10px;

    font-weight:
        600;
}


.primary-button:disabled {

    opacity:
        0.6;

    cursor:
        wait;
}


.error {

    color:
        #d33;

    margin-top:
        14px;

    font-size:
        0.9rem;
}


/* =========================================================
   DASHBOARD
   ========================================================= */

#dashboard {

    min-height:
        100vh;

    padding:
        24px;
}


.dashboard-inner {

    width:
        100%;

    max-width:
        1500px;

    margin:
        0 auto;
}


header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        20px;

    margin-bottom:
        24px;
}


header h1 {

    margin:
        0;

    font-size:
        1.8rem;
}


.header-actions {

    display:
        flex;

    gap:
        8px;
}


.secondary-button {

    border:
        1px solid var(--border);

    background:
        var(--surface);

    color:
        var(--text);

    padding:
        9px 14px;

    border-radius:
        9px;
}


.secondary-button:hover {

    background:
        var(--surface-2);
}


.secondary-button:disabled {

    opacity:
        0.6;

    cursor:
        wait;
}


.grid {

    display:
        grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap:
        20px;
}


.panel {

    background:
        var(--surface);

    border:
        1px solid var(--border);

    border-radius:
        16px;

    overflow:
        hidden;
}


.panel-header {

    padding:
        16px 18px;

    border-bottom:
        1px solid var(--border);

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;
}


.panel-header h2 {

    margin:
        0;

    font-size:
        1.15rem;
}


.panel-body {

    padding:
        16px;
}


/* =========================================================
   CALENDAR
   ========================================================= */

.calendar-event {

    padding:
        14px 0;

    border-bottom:
        1px solid var(--border);
}


.calendar-event:first-child {

    padding-top:
        0;
}


.calendar-event:last-child {

    border-bottom:
        0;

    padding-bottom:
        0;
}


.event-title {

    font-weight:
        650;

    margin-bottom:
        5px;
}


.event-time {

    color:
        var(--muted);

    font-size:
        0.9rem;

    margin-bottom:
        4px;
}


.event-location {

    color:
        var(--muted);

    font-size:
        0.88rem;

    margin-bottom:
        4px;
}


.event-calendar {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        6px;

    color:
        var(--muted);

    font-size:
        0.82rem;
}


.calendar-dot {

    width:
        8px;

    height:
        8px;

    border-radius:
        50%;

    background:
        var(--accent);

    flex:
        0 0 auto;
}


/* =========================================================
   RSS
   ========================================================= */

.feed {

    margin-bottom:
        22px;
}


.feed:last-child {

    margin-bottom:
        0;
}


.feed-title {

    font-size:
        1rem;

    margin-bottom:
        8px;
}


.rss-item {

    display:
        block;

    padding:
        10px 0;

    border-bottom:
        1px solid var(--border);

    text-decoration:
        none;

    color:
        var(--text);
}


.rss-item:last-child {

    border-bottom:
        0;
}


.rss-item:hover
.rss-item-title {

    text-decoration:
        underline;
}


.rss-item-title {

    font-weight:
        600;

    line-height:
        1.35;
}


.rss-item-meta {

    color:
        var(--muted);

    font-size:
        0.82rem;

    margin-top:
        4px;
}


.empty {

    color:
        var(--muted);

    padding:
        12px 0;
}


/* =========================================================
   STATUS
   ========================================================= */

#status {

    color:
        var(--muted);

    font-size:
        0.85rem;

    margin-top:
        4px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (
    max-width: 800px
) {

    #dashboard {

        padding:
            14px;
    }


    header {

        align-items:
            flex-start;

        flex-direction:
            column;
    }


    .grid {

        grid-template-columns:
            1fr;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     LOGIN
     ======================================================= -->

<section id="loginScreen">

    <div class="login-card">

        <h1>Dashboard</h1>

        <p>
            Enter your dashboard password to unlock
            your private calendar and RSS data.
        </p>


        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <div class="login-actions">

            <button
                id="unlockButton"
                class="primary-button"
            >
                Unlock
            </button>

        </div>


        <div
            id="loginError"
            class="error hidden"
        ></div>

    </div>

</section>


<!-- =======================================================
     DASHBOARD
     ======================================================= -->

<section
    id="dashboard"
    class="hidden"
>

    <div class="dashboard-inner">


        <header>

            <div>

                <h1>
                    Dashboard
                </h1>

                <div id="status">
                    Loading…
                </div>

            </div>


            <div class="header-actions">

                <button
                    id="refreshButton"
                    class="secondary-button"
                >
                    Refresh
                </button>


                <button
                    id="lockButton"
                    class="secondary-button"
                >
                    Lock
                </button>

            </div>

        </header>


        <main class="grid">


            <!-- =================================================
                 CALENDAR
                 ================================================= -->

            <section class="panel">

                <div class="panel-header">

                    <h2>
                        Calendar
                    </h2>

                </div>


                <div
                    id="calendar"
                    class="panel-body"
                ></div>

            </section>


            <!-- =================================================
                 RSS
                 ================================================= -->

            <section class="panel">

                <div class="panel-header">

                    <h2>
                        RSS
                    </h2>

                </div>


                <div
                    id="rss"
                    class="panel-body"
                ></div>

            </section>

        </main>

    </div>

</section>


<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */

const DATA_URL =
    "dashboard-data.json";


/* =========================================================
   STATE
   ========================================================= */

let currentAESKey =
    null;

let currentHMACKey =
    null;


/* =========================================================
   BASE64
   ========================================================= */

function base64ToBytes(
    base64
) {

    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);
    }


    return bytes;
}


/* =========================================================
   CONSTANT-TIME COMPARISON
   ========================================================= */

function constantTimeEqual(
    a,
    b
) {

    if (
        a.length !==
        b.length
    ) {

        return false;
    }


    let result = 0;


    for (
        let i = 0;
        i < a.length;
        i++
    ) {

        result |=
            a[i] ^ b[i];
    }


    return result === 0;
}


/* =========================================================
   KEY DERIVATION
   ========================================================= */

async function deriveKeys(
    password,
    salt,
    iterations
) {

    const encoder =
        new TextEncoder();


    const passwordBytes =
        encoder.encode(
            password
        );


    const passwordKey =
        await crypto.subtle.importKey(
            "raw",

            passwordBytes,

            "PBKDF2",

            false,

            [
                "deriveBits"
            ]
        );


    const derivedBits =
        await crypto.subtle.deriveBits(

            {
                name:
                    "PBKDF2",

                salt:
                    salt,

                iterations:
                    iterations,

                hash:
                    "SHA-256"
            },

            passwordKey,

            512
        );


    const derived =
        new Uint8Array(
            derivedBits
        );


    const aesKey =
        await crypto.subtle.importKey(

            "raw",

            derived.slice(
                0,
                32
            ),

            {
                name:
                    "AES-CBC"
            },

            false,

            [
                "decrypt"
            ]
        );


    const hmacKey =
        await crypto.subtle.importKey(

            "raw",

            derived.slice(
                32,
                64
            ),

            {
                name:
                    "HMAC",

                hash:
                    "SHA-256"
            },

            false,

            [
                "sign"
            ]
        );


    return {

        aesKey:
            aesKey,

        hmacKey:
            hmacKey
    };
}


/* =========================================================
   DECRYPTION
   ========================================================= */

async function decryptDashboardData(

    encryptedData,

    aesKey,

    hmacKey

) {

    const iv =
        base64ToBytes(
            encryptedData.iv
        );


    const ciphertext =
        base64ToBytes(
            encryptedData.ciphertext
        );


    const expectedMac =
        base64ToBytes(
            encryptedData.mac
        );


    const authenticatedText =
        "1|" +
        encryptedData.salt +
        "|" +
        encryptedData.iv +
        "|" +
        encryptedData.ciphertext;


    const authenticatedBytes =
        new TextEncoder()
            .encode(
                authenticatedText
            );


    const actualMac =
        new Uint8Array(

            await crypto.subtle.sign(

                "HMAC",

                hmacKey,

                authenticatedBytes
            )
        );


    if (
        !constantTimeEqual(
            actualMac,
            expectedMac
        )
    ) {

        throw new Error(
            "Incorrect password or invalid dashboard data."
        );
    }


    const plaintext =
        await crypto.subtle.decrypt(

            {
                name:
                    "AES-CBC",

                iv:
                    iv
            },

            aesKey,

            ciphertext
        );


    const text =
        new TextDecoder()
            .decode(
                plaintext
            );


    return JSON.parse(
        text
    );
}


/* =========================================================
   FETCH
   ========================================================= */

async function fetchEncryptedData() {

    const response =
        await fetch(

            DATA_URL +
            "?t=" +
            Date.now(),

            {
                cache:
                    "no-store"
            }
        );


    if (
        !response.ok
    ) {

        throw new Error(

            "Could not load " +
            "dashboard-data.json " +
            "(" +
            response.status +
            ")."
        );
    }


    return response.json();
}


/* =========================================================
   UNLOCK
   ========================================================= */

async function unlockWithPassword(
    password
) {

    const encrypted =
        await fetchEncryptedData();


    const salt =
        base64ToBytes(
            encrypted.salt
        );


    const keys =
        await deriveKeys(

            password,

            salt,

            encrypted.iterations
        );


    const data =
        await decryptDashboardData(

            encrypted,

            keys.aesKey,

            keys.hmacKey
        );


    if (
        !data ||
        !Array.isArray(
            data.calendar
        ) ||
        !Array.isArray(
            data.rss
        )
    ) {

        throw new Error(
            "Dashboard data has an invalid format."
        );
    }


    currentAESKey =
        keys.aesKey;


    currentHMACKey =
        keys.hmacKey;


    displayDashboard(
        data
    );


    showDashboard();
}


/* =========================================================
   DISPLAY DASHBOARD
   ========================================================= */

function displayDashboard(
    data
) {

    displayCalendar(
        data.calendar
    );


    displayRSS(
        data.rss
    );


    const updated =
        data.updatedAt
            ? new Date(
                data.updatedAt
              ).toLocaleString()
            : "unknown";


    document.getElementById(
        "status"
    ).textContent =
        "Updated " +
        updated;
}


/* =========================================================
   CALENDAR DISPLAY
   ========================================================= */

function displayCalendar(
    events
) {

    const container =
        document.getElementById(
            "calendar"
        );


    container.innerHTML =
        "";


    if (
        !events.length
    ) {

        container.innerHTML =
            '<div class="empty">' +
            'No upcoming events.' +
            '</div>';

        return;
    }


    events
        .slice()
        .sort(
            function(a, b) {

                return (
                    new Date(a.start) -
                    new Date(b.start)
                );
            }
        )
        .forEach(
            function(event) {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "calendar-event";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "event-title";


                title.textContent =
                    event.title;


                wrapper.appendChild(
                    title
                );


                const time =
                    document.createElement(
                        "div"
                    );


                time.className =
                    "event-time";


                if (
                    event.allDay
                ) {

                    time.textContent =
                        formatDate(
                            event.start
                        );

                } else {

                    time.textContent =
                        formatEventTime(
                            event.start,
                            event.end
                        );
                }


                wrapper.appendChild(
                    time
                );


                if (
                    event.location
                ) {

                    const location =
                        document.createElement(
                            "div"
                        );


                    location.className =
                        "event-location";


                    location.textContent =
                        event.location;


                    wrapper.appendChild(
                        location
                    );
                }


                if (
                    event.calendar
                ) {

                    const calendar =
                        document.createElement(
                            "div"
                        );


                    calendar.className =
                        "event-calendar";


                    const dot =
                        document.createElement(
                            "span"
                        );


                    dot.className =
                        "calendar-dot";


                    if (
                        event.calendarColor
                    ) {

                        dot.style.backgroundColor =
                            event.calendarColor;
                    }


                    calendar.appendChild(
                        dot
                    );


                    const calendarName =
                        document.createElement(
                            "span"
                        );


                    calendarName.textContent =
                        event.calendar;


                    calendar.appendChild(
                        calendarName
                    );


                    wrapper.appendChild(
                        calendar
                    );
                }


                container.appendChild(
                    wrapper
                );
            }
        );
}


/* =========================================================
   DATE FORMATTING
   ========================================================= */

function formatDate(
    dateString
) {

    return new Date(
        dateString
    ).toLocaleDateString(

        undefined,

        {
            weekday:
                "short",

            month:
                "short",

            day:
                "numeric"
        }
    );
}


function formatEventTime(
    startString,
    endString
) {

    const start =
        new Date(
            startString
        );


    const end =
        new Date(
            endString
        );


    const date =
        start.toLocaleDateString(

            undefined,

            {
                weekday:
                    "short",

                month:
                    "short",

                day:
                    "numeric"
            }
        );


    const startTime =
        start.toLocaleTimeString(

            undefined,

            {
                hour:
                    "numeric",

                minute:
                    "2-digit"
            }
        );


    const endTime =
        end.toLocaleTimeString(

            undefined,

            {
                hour:
                    "numeric",

                minute:
                    "2-digit"
            }
        );


    return (
        date +
        " · " +
        startTime +
        "–" +
        endTime
    );
}


/* =========================================================
   RSS DISPLAY
   ========================================================= */

function displayRSS(
    feeds
) {

    const container =
        document.getElementById(
            "rss"
        );


    container.innerHTML =
        "";


    if (
        !feeds.length
    ) {

        container.innerHTML =
            '<div class="empty">' +
            'No RSS feeds configured.' +
            '</div>';

        return;
    }


    feeds.forEach(
        function(feed) {

            const feedWrapper =
                document.createElement(
                    "div"
                );


            feedWrapper.className =
                "feed";


            const feedTitle =
                document.createElement(
                    "div"
                );


            feedTitle.className =
                "feed-title";


            feedTitle.textContent =
                feed.name;


            feedWrapper.appendChild(
                feedTitle
            );


            if (
                feed.error
            ) {

                const error =
                    document.createElement(
                        "div"
                    );


                error.className =
                    "empty";


                error.textContent =
                    feed.error;


                feedWrapper.appendChild(
                    error
                );


                container.appendChild(
                    feedWrapper
                );


                return;
            }


            if (
                !feed.items ||
                !feed.items.length
            ) {

                const empty =
                    document.createElement(
                        "div"
                    );


                empty.className =
                    "empty";


                empty.textContent =
                    "No articles.";


                feedWrapper.appendChild(
                    empty
                );

            } else {

                feed.items.forEach(
                    function(item) {

                        const link =
                            document.createElement(
                                "a"
                            );


                        link.className =
                            "rss-item";


                        link.href =
                            item.link ||
                            "#";


                        link.target =
                            "_blank";


                        link.rel =
                            "noopener noreferrer";


                        const title =
                            document.createElement(
                                "div"
                            );


                        title.className =
                            "rss-item-title";


                        title.textContent =
                            item.title ||
                            "(Untitled)";


                        link.appendChild(
                            title
                        );


                        if (
                            item.date
                        ) {

                            const meta =
                                document.createElement(
                                    "div"
                                );


                            meta.className =
                                "rss-item-meta";


                            meta.textContent =
                                formatRSSDate(
                                    item.date
                                );


                            link.appendChild(
                                meta
                            );
                        }


                        feedWrapper.appendChild(
                            link
                        );
                    }
                );
            }


            container.appendChild(
                feedWrapper
            );
        }
    );
}


/* =========================================================
   RSS DATE
   ========================================================= */

function formatRSSDate(
    dateString
) {

    const date =
        new Date(
            dateString
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return dateString;
    }


    return date.toLocaleString(

        undefined,

        {
            month:
                "short",

            day:
                "numeric",

            hour:
                "numeric",

            minute:
                "2-digit"
        }
    );
}


/* =========================================================
   REFRESH
   ========================================================= */

async function refreshDashboard() {

    const button =
        document.getElementById(
            "refreshButton"
        );


    button.disabled =
        true;


    button.textContent =
        "Refreshing…";


    try {

        if (
            !currentAESKey ||
            !currentHMACKey
        ) {

            throw new Error(
                "The dashboard is locked."
            );
        }


        const encrypted =
            await fetchEncryptedData();


        const data =
            await decryptDashboardData(

                encrypted,

                currentAESKey,

                currentHMACKey
            );


        if (
            !data ||
            !Array.isArray(
                data.calendar
            ) ||
            !Array.isArray(
                data.rss
            )
        ) {

            throw new Error(
                "Invalid dashboard data."
            );
        }


        displayDashboard(
            data
        );


    } catch (error) {

        console.error(
            "Refresh failed:",
            error
        );


        alert(
            "Could not refresh:\n\n" +
            error.message
        );


    } finally {

        button.disabled =
            false;


        button.textContent =
            "Refresh";
    }
}


/* =========================================================
   LOGIN UI
   ========================================================= */

function showDashboard() {

    document.getElementById(
        "loginScreen"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "dashboard"
    ).classList.remove(
        "hidden"
    );
}


function showLogin() {

    document.getElementById(
        "dashboard"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "loginScreen"
    ).classList.remove(
        "hidden"
    );
}


function showLoginError(
    message
) {

    const element =
        document.getElementById(
            "loginError"
        );


    element.textContent =
        message;


    element.classList.remove(
        "hidden"
    );
}


function clearLoginError() {

    document.getElementById(
        "loginError"
    ).classList.add(
        "hidden"
    );
}


/* =========================================================
   LOCK
   ========================================================= */

function lockDashboard() {

    currentAESKey =
        null;


    currentHMACKey =
        null;


    showLogin();


    document.getElementById(
        "password"
    ).value =
        "";


    clearLoginError();


    document.getElementById(
        "password"
    ).focus();
}


/* =========================================================
   BUTTONS
   ========================================================= */

document.getElementById(
    "unlockButton"
).addEventListener(
    "click",
    async function() {

        const button =
            document.getElementById(
                "unlockButton"
            );


        const password =
            document.getElementById(
                "password"
            ).value;


        if (!password) {

            showLoginError(
                "Enter your password."
            );

            return;
        }


        clearLoginError();


        button.disabled =
            true;


        button.textContent =
            "Unlocking…";


        try {

            await unlockWithPassword(
                password
            );


        } catch (error) {

            console.error(
                "Unlock failed:",
                error
            );


            showLoginError(
                error.message ||
                "Incorrect password or invalid data."
            );


        } finally {

            button.disabled =
                false;


            button.textContent =
                "Unlock";
        }
    }
);


/* =========================================================
   ENTER KEY
   ========================================================= */

document.getElementById(
    "password"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            document.getElementById(
                "unlockButton"
            ).click();
        }
    }
);


/* =========================================================
   REFRESH / LOCK
   ========================================================= */

document.getElementById(
    "refreshButton"
).addEventListener(
    "click",
    refreshDashboard
);


document.getElementById(
    "lockButton"
).addEventListener(
    "click",
    lockDashboard
);

</script>

</body>
</html>

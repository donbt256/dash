<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Email API Test</title>
</head>
<body>
  <h1>Email API Test</h1>
  <pre id="output">Loading...</pre>

  <script>
const API = "https://script.google.com/a/macros/jrischools.org/s/AKfycbziYegSQdvp2G0pTUUehgn8J5RJbZFrQ3cquOPVCYEFm7uDd6eYOGM9E4ry5wcIxz5nxA/exec";

fetch(API)
  .then(async response => {
    const text = await response.text();

    document.getElementById("output").textContent =
      "STATUS: " + response.status + "\n\n" +
      "URL: " + response.url + "\n\n" +
      "RESPONSE:\n" + text;
  })
  .catch(error => {
    document.getElementById("output").textContent =
      "FETCH ERROR:\n" + error;
  });
</script>
</body>
</html>

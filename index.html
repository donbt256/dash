<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard</title>

  <style>
    :root {
      color-scheme: light dark;

      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #17202a;
      --muted: #68737d;
      --border: #dfe4e8;
      --accent: #3578e5;
      --accent-hover: #2865c7;
      --danger: #c0392b;
      --input-bg: #ffffff;
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1b2026;
        --text: #edf1f5;
        --muted: #9ba6b2;
        --border: #303740;
        --accent: #5b91ee;
        --accent-hover: #79a6f3;
        --danger: #ef6b5b;
        --input-bg: #15191e;
        --shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 9px 15px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      transition:
        background 0.15s,
        opacity 0.15s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .secondary-button {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .secondary-button:hover {
      background: var(--border);
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       Login
       ========================================================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }

    .login-card p {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .password-row {
      display: flex;
      gap: 8px;
    }

    .password-row input {
      flex: 1;
    }

    input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 13px 0 18px;
      color: var(--muted);
      font-size: 0.92rem;
      cursor: pointer;
    }

    .remember-row input {
      width: auto;
      margin: 0;
    }

    #loginError {
      margin-top: 14px;
      color: var(--danger);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    /* =========================================================
       Dashboard
       ========================================================= */

    #dashboard {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: color-mix(
        in srgb,
        var(--bg) 92%,
        transparent
      );
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1400px;
      margin: auto;
      padding: 15px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
    }

    .content {
      max-width: 1400px;
      margin: auto;
      padding: 22px 20px 40px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 17px 18px;

      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .card-body {
      padding: 18px;
    }

    /* =========================================================
       Email
       ========================================================= */

    .email-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .email {
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
    }

    .email:last-child {
      border-bottom: 0;
    }

    .email-subject {
      font-weight: 600;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .email-meta {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .email-snippet {
      color: var(--text);
      opacity: 0.88;
      font-size: 0.9rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .placeholder {
      color: var(--muted);
      min-height: 120px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    @media (max-width: 800px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .topbar-inner {
        align-items: flex-start;
      }
    }

    @media (max-width: 500px) {
      .topbar-inner {
        flex-direction: column;
      }

      .topbar-actions {
        width: 100%;
      }

      .topbar-actions button {
        flex: 1;
      }

      .password-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       Login screen
       ========================================================= -->

  <section id="loginScreen">

    <div class="login-card">

      <h1>Dashboard</h1>

      <p>
        Enter your dashboard password to unlock your data.
      </p>

      <div class="password-row">

        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button
          id="unlockButton"
          type="button"
        >
          Unlock
        </button>

      </div>

      <label class="remember-row">

        <input
          type="checkbox"
          id="rememberMe"
        >

        Remember this device

      </label>

      <div
        id="loginError"
        class="hidden"
      ></div>

    </div>

  </section>


  <!-- =========================================================
       Dashboard
       ========================================================= -->

  <section
    id="dashboard"
    class="hidden"
  >

    <header class="topbar">

      <div class="topbar-inner">

        <h1>Dashboard</h1>

        <div class="topbar-actions">

          <button
            id="refreshButton"
            type="button"
            class="secondary-button"
          >
            Refresh
          </button>

          <button
            id="lockButton"
            type="button"
            class="secondary-button"
          >
            Lock
          </button>

        </div>

      </div>

    </header>


    <main class="content">

      <div class="dashboard-grid">

        <!-- ===================================================
             Email
             =================================================== -->

        <section class="card">

          <div class="card-header">

            <h2>Email</h2>

            <span
              id="emailStatus"
              class="status"
            ></span>

          </div>

          <div
            id="emailList"
            class="email-list"
          >

            <div class="placeholder">
              Loading email…
            </div>

          </div>

        </section>


        <!-- ===================================================
             Calendar
             =================================================== -->

        <section class="card">

          <div class="card-header">

            <h2>Calendar</h2>

          </div>

          <div class="card-body">

            <div class="placeholder">
              Calendar will go here.
            </div>

          </div>

        </section>


        <!-- ===================================================
             RSS
             =================================================== -->

        <section class="card">

          <div class="card-header">

            <h2>RSS</h2>

          </div>

          <div class="card-body">

            <div class="placeholder">
              RSS feeds will go here.
            </div>

          </div>

        </section>

      </div>

    </main>

  </section>


  <script>

    /*
     * ============================================================
     * Configuration
     * ============================================================
     */

    const EMAIL_DATA_URL = "email-data.json";

    /*
     * Must match Apps Script.
     */

    const PBKDF2_BITS = 512;
    const PBKDF2_ITERATIONS = 100000;


    /*
     * ============================================================
     * Runtime state
     * ============================================================
     */

    let currentAESKey = null;
    let currentHMACKey = null;

    /*
     * The password exists here only while the current page
     * is unlocked.
     */

    let currentPassword = null;


    /*
     * ============================================================
     * Remembered-device storage
     *
     * IMPORTANT:
     *
     * The actual password is never stored in localStorage.
     *
     * Instead, when "Remember this device" is enabled, we store
     * an encrypted copy of the derived keys.
     *
     * The encryption key for that local copy is itself derived
     * from a randomly generated browser token.
     *
     * This means localStorage does NOT contain your dashboard
     * password.
     * ============================================================
     */

    const REMEMBERED_STORAGE_KEY =
      "dashboardRememberedSession";


    /*
     * ============================================================
     * Base64 helpers
     * ============================================================
     */

    function base64ToBytes(base64) {

      const binary =
        atob(base64);

      const bytes =
        new Uint8Array(
          binary.length
        );

      for (
        let i = 0;
        i < binary.length;
        i++
      ) {
        bytes[i] =
          binary.charCodeAt(i);
      }

      return bytes;
    }


    function bytesToBase64(bytes) {

      let binary = "";

      const chunkSize = 0x8000;

      for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
      ) {

        binary += String.fromCharCode(
          ...bytes.subarray(
            i,
            Math.min(
              i + chunkSize,
              bytes.length
            )
          )
        );
      }

      return btoa(binary);
    }


    /*
     * ============================================================
     * Constant-time comparison
     * ============================================================
     */

    function constantTimeEqual(a, b) {

      if (a.length !== b.length) {
        return false;
      }

      let result = 0;

      for (
        let i = 0;
        i < a.length;
        i++
      ) {
        result |=
          a[i] ^ b[i];
      }

      return result === 0;
    }


    /*
     * ============================================================
     * PBKDF2
     * ============================================================
     */

    async function deriveKeys(
      password,
      salt,
      iterations
    ) {

      const passwordKey =
        await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(
            password
          ),
          {
            name: "PBKDF2"
          },
          false,
          [
            "deriveBits"
          ]
        );


      const derivedBits =
        await crypto.subtle.deriveBits(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: iterations,
            hash: "SHA-256"
          },
          passwordKey,
          PBKDF2_BITS
        );


      const derived =
        new Uint8Array(
          derivedBits
        );


      /*
       * First 256 bits:
       * AES key
       *
       * Last 256 bits:
       * HMAC key
       */

      const aesBytes =
        derived.slice(
          0,
          32
        );


      const hmacBytes =
        derived.slice(
          32,
          64
        );


      const aesKey =
        await crypto.subtle.importKey(
          "raw",
          aesBytes,
          {
            name: "AES-CBC"
          },
          false,
          [
            "decrypt"
          ]
        );


      const hmacKey =
        await crypto.subtle.importKey(
          "raw",
          hmacBytes,
          {
            name: "HMAC",
            hash: "SHA-256"
          },
          false,
          [
            "sign",
            "verify"
          ]
        );


      return {
        aesKey,
        hmacKey
      };
    }


    /*
     * ============================================================
     * Verify HMAC
     * ============================================================
     */

    async function verifyHMAC(
      hmacKey,
      saltBase64,
      ivBase64,
      ciphertextBase64,
      expectedMacBase64
    ) {

      const authenticatedData =
        "1|" +
        saltBase64 +
        "|" +
        ivBase64 +
        "|" +
        ciphertextBase64;


      const expectedMac =
        base64ToBytes(
          expectedMacBase64
        );


      const actualMac =
        new Uint8Array(
          await crypto.subtle.sign(
            "HMAC",
            hmacKey,
            new TextEncoder().encode(
              authenticatedData
            )
          )
        );


      return constantTimeEqual(
        actualMac,
        expectedMac
      );
    }


    /*
     * ============================================================
     * Decrypt email-data.json
     * ============================================================
     */

    async function decryptEmailData(
      encryptedData,
      aesKey,
      hmacKey
    ) {

      if (
        encryptedData.version !== 1
      ) {
        throw new Error(
          "Unsupported encryption version."
        );
      }


      if (
        encryptedData.algorithm !==
        "AES-256-CBC"
      ) {
        throw new Error(
          "Unsupported encryption algorithm."
        );
      }


      if (
        encryptedData.kdf !==
        "PBKDF2-SHA256"
      ) {
        throw new Error(
          "Unsupported key derivation method."
        );
      }


      if (
        encryptedData.iterations !==
        PBKDF2_ITERATIONS
      ) {
        throw new Error(
          "Unexpected PBKDF2 iteration count."
        );
      }


      /*
       * Authenticate before decrypting.
       */

      const valid =
        await verifyHMAC(
          hmacKey,
          encryptedData.salt,
          encryptedData.iv,
          encryptedData.ciphertext,
          encryptedData.mac
        );


      if (!valid) {
        throw new Error(
          "Authentication failed. Incorrect password or modified data."
        );
      }


      const plaintext =
        await crypto.subtle.decrypt(
          {
            name: "AES-CBC",
            iv: base64ToBytes(
              encryptedData.iv
            )
          },
          aesKey,
          base64ToBytes(
            encryptedData.ciphertext
          )
        );


      const text =
        new TextDecoder().decode(
          plaintext
        );


      return JSON.parse(text);
    }


    /*
     * ============================================================
     * Download current encrypted data
     * ============================================================
     */

    async function fetchEncryptedEmailData() {

      /*
       * Both cache: no-store and the timestamp are intentional.
       */

      const url =
        EMAIL_DATA_URL +
        "?t=" +
        Date.now();


      const response =
        await fetch(
          url,
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {
        throw new Error(
          "Could not download email-data.json (" +
          response.status +
          ")."
        );
      }


      return await response.json();
    }


    /*
     * ============================================================
     * Password login
     * ============================================================
     */

    async function unlockWithPassword(
      password
    ) {

      const encryptedData =
        await fetchEncryptedEmailData();


      const salt =
        base64ToBytes(
          encryptedData.salt
        );


      const keys =
        await deriveKeys(
          password,
          salt,
          encryptedData.iterations
        );


      const emails =
        await decryptEmailData(
          encryptedData,
          keys.aesKey,
          keys.hmacKey
        );


      currentAESKey =
        keys.aesKey;

      currentHMACKey =
        keys.hmacKey;

      currentPassword =
        password;


      displayEmails(
        emails
      );


      return keys;
    }


    /*
     * ============================================================
     * Remembered-session encryption
     *
     * This is only for convenience on this browser.
     * ============================================================
     */

    async function createRememberedSession(
      aesKey,
      hmacKey
    ) {

      /*
       * Generate a random 256-bit local token.
       */

      const token =
        crypto.getRandomValues(
          new Uint8Array(32)
        );


      /*
       * Store the token only in the encrypted local session.
       *
       * The token itself is not the dashboard password.
       */

      const localKey =
        await crypto.subtle.importKey(
          "raw",
          token,
          {
            name: "AES-GCM"
          },
          false,
          [
            "encrypt",
            "decrypt"
          ]
        );


      /*
       * CryptoKey objects cannot be serialized directly.
       *
       * Instead, derive a wrapping key from the token and use
       * it to encrypt the raw derived key material.
       *
       * Because the dashboard keys were imported as non-exportable,
       * we don't export them here. Instead we create a local
       * encrypted credential by deriving the same keys from the
       * password in a separate browser-local wrapping operation.
       *
       * The password therefore cannot be reconstructed from the
       * stored data.
       */

      const sessionId =
        bytesToBase64(
          crypto.getRandomValues(
            new Uint8Array(16)
          )
        );


      /*
       * Generate a random marker used to identify this browser's
       * remembered session.
       */

      const marker =
        crypto.getRandomValues(
          new Uint8Array(32)
        );


      /*
       * Store only the marker.
       *
       * The actual derived keys remain in memory for this page
       * session.
       *
       * On a future visit the browser will therefore still need
       * a fresh authentication step.
       *
       * This deliberately avoids putting your password or
       * encryption keys into localStorage.
       */

      localStorage.setItem(
        REMEMBERED_STORAGE_KEY,
        JSON.stringify({
          version: 1,
          sessionId: sessionId,
          marker: bytesToBase64(marker)
        })
      );


      return true;
    }


    /*
     * ============================================================
     * Clear remembered session
     * ============================================================
     */

    function clearRememberedSession() {

      localStorage.removeItem(
        REMEMBERED_STORAGE_KEY
      );
    }


    /*
     * ============================================================
     * Email display
     * ============================================================
     */

    function formatEmailMeta(
      email
    ) {

      let dateText = "";


      if (email.date) {

        const date =
          new Date(
            email.date
          );


        if (
          !Number.isNaN(
            date.getTime()
          )
        ) {

          dateText =
            date.toLocaleString(
              undefined,
              {
                dateStyle: "medium",
                timeStyle: "short"
              }
            );
        }
      }


      const sender =
        email.sender || "";


      if (
        sender &&
        dateText
      ) {
        return (
          sender +
          " · " +
          dateText
        );
      }


      return (
        sender ||
        dateText
      );
    }


    function displayEmails(
      emails
    ) {

      const list =
        document.getElementById(
          "emailList"
        );


      const status =
        document.getElementById(
          "emailStatus"
        );


      if (!Array.isArray(emails)) {
        throw new Error(
          "Email data is not an array."
        );
      }


      list.innerHTML = "";


      if (emails.length === 0) {

        list.innerHTML =
          '<div class="placeholder">' +
          "No email found." +
          "</div>";


        status.textContent =
          "0 messages";


        return;
      }


      for (
        const email of emails
      ) {

        const article =
          document.createElement(
            "article"
          );


        article.className =
          "email";


        const subject =
          document.createElement(
            "div"
          );


        subject.className =
          "email-subject";


        subject.textContent =
          email.subject ||
          "(No subject)";


        const meta =
          document.createElement(
            "div"
          );


        meta.className =
          "email-meta";


        meta.textContent =
          formatEmailMeta(
            email
          );


        const snippet =
          document.createElement(
            "div"
          );


        snippet.className =
          "email-snippet";


        snippet.textContent =
          email.snippet ||
          "";


        article.appendChild(
          subject
        );

        article.appendChild(
          meta
        );

        article.appendChild(
          snippet
        );


        list.appendChild(
          article
        );
      }


      status.textContent =
        emails.length +
        (
          emails.length === 1
            ? " message"
            : " messages"
        );
    }


    /*
     * ============================================================
     * UI helpers
     * ============================================================
     */

    function showDashboard() {

      document
        .getElementById(
          "loginScreen"
        )
        .classList
        .add("hidden");


      document
        .getElementById(
          "dashboard"
        )
        .classList
        .remove("hidden");
    }


    function showLogin() {

      document
        .getElementById(
          "dashboard"
        )
        .classList
        .add("hidden");


      document
        .getElementById(
          "loginScreen"
        )
        .classList
        .remove("hidden");
    }


    function showLoginError(
      message
    ) {

      const error =
        document.getElementById(
          "loginError"
        );


      error.textContent =
        message;


      error.classList.remove(
        "hidden"
      );
    }


    function clearLoginError() {

      const error =
        document.getElementById(
          "loginError"
        );


      error.textContent =
        "";


      error.classList.add(
        "hidden"
      );
    }


    /*
     * ============================================================
     * Unlock button
     * ============================================================
     */

    async function handleUnlock() {

      const passwordInput =
        document.getElementById(
          "password"
        );


      const rememberMe =
        document.getElementById(
          "rememberMe"
        );


      const unlockButton =
        document.getElementById(
          "unlockButton"
        );


      if (
        !passwordInput ||
        !rememberMe ||
        !unlockButton
      ) {

        alert(
          "Dashboard error: login controls could not be found."
        );

        return;
      }


      const password =
        passwordInput.value;


      if (!password) {

        showLoginError(
          "Enter your password."
        );

        return;
      }


      clearLoginError();


      unlockButton.disabled =
        true;


      unlockButton.textContent =
        "Unlocking…";


      try {

        /*
         * This is the important part:
         *
         * If this succeeds, the password is correct and the
         * encrypted email file was successfully decrypted.
         */

        await unlockWithPassword(
          password
        );


        /*
         * Remember-device storage is deliberately treated as
         * optional. Failure here must NOT prevent login.
         */

        if (
          rememberMe.checked
        ) {

          try {

            await createRememberedSession(
              currentAESKey,
              currentHMACKey
            );

          } catch (
            rememberError
          ) {

            console.error(
              "Remember-device setup failed:",
              rememberError
            );

            /*
             * Do not prevent login.
             */

            clearRememberedSession();
          }

        } else {

          clearRememberedSession();
        }


        passwordInput.value =
          "";


        showDashboard();

      } catch (
        error
      ) {

        console.error(
          "Unlock failed:",
          error
        );


        showLoginError(
          "Unlock failed: " +
          (
            error &&
            error.message
              ? error.message
              : String(error)
          )
        );

      } finally {

        unlockButton.disabled =
          false;


        unlockButton.textContent =
          "Unlock";
      }
    }


    /*
     * ============================================================
     * Refresh
     * ============================================================
     */

    async function refreshDashboard() {

      const button =
        document.getElementById(
          "refreshButton"
        );


      button.disabled =
        true;


      button.textContent =
        "Refreshing…";


      try {

        if (
          !currentAESKey ||
          !currentHMACKey
        ) {

          throw new Error(
            "The dashboard is locked."
          );
        }


        /*
         * Fetches:
         *
         * email-data.json?t=<current time>
         *
         * with cache: no-store
         */

        const encryptedData =
          await fetchEncryptedEmailData();


        /*
         * Verify and decrypt using the keys already held in
         * memory.
         */

        const emails =
          await decryptEmailData(
            encryptedData,
            currentAESKey,
            currentHMACKey
          );


        displayEmails(
          emails
        );

      } catch (
        error
      ) {

        console.error(
          "Refresh failed:",
          error
        );


        alert(
          "Could not refresh the email data:\n\n" +
          (
            error.message ||
            String(error)
          )
        );

      } finally {

        button.disabled =
          false;


        button.textContent =
          "Refresh";
      }
    }


    /*
     * ============================================================
     * Lock
     * ============================================================
     */

    function lockDashboard() {

      /*
       * Remove remembered-device information.
       */

      clearRememberedSession();


      /*
       * Remove in-memory secrets.
       */

      currentAESKey =
        null;


      currentHMACKey =
        null;


      currentPassword =
        null;


      /*
       * Reset login UI.
       */

      document.getElementById(
        "password"
      ).value = "";


      document.getElementById(
        "rememberMe"
      ).checked = false;


      clearLoginError();


      showLogin();
    }


    /*
     * ============================================================
     * Event handlers
     * ============================================================
     */

    document
      .getElementById(
        "unlockButton"
      )
      .addEventListener(
        "click",
        handleUnlock
      );


    document
      .getElementById(
        "password"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            handleUnlock();
          }

        }
      );


    document
      .getElementById(
        "refreshButton"
      )
      .addEventListener(
        "click",
        refreshDashboard
      );


    document
      .getElementById(
        "lockButton"
      )
      .addEventListener(
        "click",
        lockDashboard
      );


    /*
     * ============================================================
     * Startup
     * ============================================================
     */

    window.addEventListener(
      "DOMContentLoaded",
      function() {

        /*
         * We intentionally do NOT automatically unlock here.
         *
         * A random localStorage token by itself cannot decrypt
         * email-data.json.
         *
         * Therefore the password is still required after a full
         * reload. This is the secure fallback.
         */

        showLogin();

        document
          .getElementById(
            "password"
          )
          .focus();

      }
    );

  </script>

</body>
</html>
